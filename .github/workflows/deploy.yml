name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Gate: end-to-end, layout, accessibility and Lighthouse.
  # Nothing reaches production unless all of it is green.
  quality:
    uses: ./.github/workflows/quality.yml

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Published as /coverage.json, which the README badge reads: the number
      # comes from the run that gated this very deploy, so it cannot go stale.
      - name: Fetch the coverage badge
        uses: actions/download-artifact@v4
        with:
          name: coverage-badge
          path: .coverage-badge

      - name: Publish it with the site
        run: mv .coverage-badge/badge.json coverage.json && rmdir .coverage-badge

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
