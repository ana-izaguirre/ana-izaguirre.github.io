name: Quality

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  e2e:
    name: E2E, layout and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tooling
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the suite
        run: npx playwright test

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    name: Lighthouse gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tooling
        run: npm ci

      # ubuntu-latest ships Google Chrome; chrome-launcher finds it on its own.
      - name: Measure
        run: node scripts/lighthouse.mjs
        env:
          LH_RUNS: 3

      - name: Publish the scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 14
